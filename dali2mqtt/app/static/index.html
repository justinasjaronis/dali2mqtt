<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DALI Config</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e2e5ea; --ink:#1c2733; --muted:#6b7684;
    --accent:#0a7cff; --accent-ink:#fff; --warn:#c0392b; --ok:#1e8e5a; --chip:#eef2f7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12151a; --panel:#1b1f27; --line:#2b313c; --ink:#e6eaf0; --muted:#93a0b0;
           --accent:#3a9bff; --chip:#232a34; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.warn{color:var(--warn);border-color:var(--warn)}
  button:disabled{opacity:.5;cursor:default}
  .layout{display:grid;grid-template-columns:260px 1fr;gap:0;height:calc(100vh - 53px)}
  @media(max-width:720px){.layout{grid-template-columns:1fr;height:auto}}
  .list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:var(--chip)}
  .row.sel{background:var(--chip);border-left:3px solid var(--accent);padding-left:9px}
  .row .a{font-weight:650}
  .row .lvl{font-size:12px;color:var(--muted)}
  .detail{padding:16px;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px;font-weight:650}
  .field{display:flex;align-items:center;gap:10px;margin:8px 0}
  .field label{width:150px;color:var(--muted)}
  .field input[type=number]{width:90px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
  .field input[type=range]{flex:1}
  .grp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:420px}
  .grp label{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:2px}
  .scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px}
  .scene{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .scene .n{font-size:11px;color:var(--muted)}
  .scene input{width:100%;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
  .cmds{display:flex;flex-wrap:wrap;gap:6px}
  .muted{color:var(--muted)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:.95}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>⬤ DALI Config</h1>
  <button class="primary" id="btnScan" onclick="scan()">Scan bus</button>
  <button id="btnScanDev" onclick="scanDevices()" title="Scan DALI-2 control devices (buttons/sensors)">Scan devices</button>
  <button id="btnDetect" onclick="detectSwitches()" title="Like DALI Cockpit: assign addresses to DALI-2 switches/sensors that have none, so they can be read &amp; configured">🎛 Detect switches</button>
  <button id="btnScanLuna" onclick="scanLunatone()" title="Read Lunatone config bank (bank 3) from every gear — find switches &amp; their target addresses">Scan Lunatone</button>
  <button id="btnMon" onclick="toggleMonitor()" title="Watch live bus traffic — press a button to see what it sends (finds DALI-1 switches)">🔎 Bus monitor</button>
  <button id="btnSwitches" onclick="openSwitches()" title="Map physical DALI switches to Home Assistant entities">⚙ Switches</button>
  <button id="btnCmd" onclick="openCommands()" title="Send raw DALI commands (like Cockpit DALI Commands)">⌘ Commands</button>
  <button onclick="reinit()" title="Refresh Home Assistant MQTT entities">Refresh HA entities</button>
  <span style="flex:1"></span>
  <button onclick="commission(false)" title="Assign addresses to new/unaddressed gear">Commission (new)</button>
  <button onclick="toggleAdvanced()" title="Advanced / danger tools" style="opacity:.5">⋯</button>
  <button id="btnReaddr" class="warn" onclick="readdressAll()" style="display:none" title="DANGER: clears and re-indexes ALL addresses">Re-address all…</button>
</header>

<div class="layout">
  <div class="list" id="list"><div class="empty">Press <b>Scan bus</b> to discover devices.</div></div>
  <div class="detail" id="detail"><div class="empty">No device selected.</div></div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let GEAR = [];        // control gear scan results
let DEVICES = [];     // control device (button/sensor) scan results
let SEL = null;       // selected gear address
let SELDEV = null;    // selected device address

// Ingress-safe: use RELATIVE URLs so they resolve against the ingress base
// path (HA serves the add-on at /api/hassio_ingress/<token>/ with a trailing
// slash, so "api/scan" -> .../<token>/api/scan).
async function api(path, opts){
  const r = await fetch(path.replace(/^\//,""), opts);
  if(!r.ok){ let e; try{e=(await r.json()).error}catch(_){}; throw new Error(e||("HTTP "+r.status)); }
  return r.json();
}
function post(path, body){ return api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})}); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

async function scan(){
  const b=$("#btnScan"); b.disabled=true; b.innerHTML='<span class="spin"></span> Scanning…';
  $("#list").innerHTML='<div class="empty"><span class="spin"></span> Scanning bus…</div>';
  try{
    const d = await api("api/scan");
    GEAR = d.gear||[];
    renderList();
    if(GEAR.length && SEL===null) select(GEAR[0].address);
    else if(SEL!==null) select(SEL);
    toast("Found "+GEAR.length+" control gear");
  }catch(e){ $("#list").innerHTML='<div class="empty">Scan failed: '+e.message+'</div>'; }
  finally{ b.disabled=false; b.textContent="Scan bus"; }
}

function renderList(){
  let html = "";
  if(!GEAR.length){ html += '<div class="empty">No control gear found.</div>'; }
  else html += GEAR.map(g=>`
    <div class="row ${g.address===SEL?'sel':''}" onclick="select(${g.address})">
      <span class="a">A${g.address}</span>
      <span class="lvl">lvl ${g.level??'–'} · grp ${g.groups.length?g.groups.join(','):'–'}</span>
    </div>`).join("");
  if(DEVICES.length){
    html += '<div class="row" style="cursor:default;background:var(--chip);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Control devices</div>';
    html += DEVICES.map(d=>`
      <div class="row ${d.address===SELDEV?'sel':''}" onclick="selectDevice(${d.address})">
        <span class="a">D${d.address}</span>
        <span class="lvl">${d.instances??'?'} inst · mode ${d.operating_mode??'–'}</span>
      </div>`).join("");
  }
  $("#list").innerHTML = html;
}

function gearOf(a){ return GEAR.find(g=>g.address===a); }
function deviceOf(a){ return DEVICES.find(d=>d.address===a); }

async function scanDevices(){
  const b=$("#btnScanDev"); b.disabled=true; b.innerHTML='<span class="spin"></span> Scanning…';
  try{
    const d = await api("api/scan_devices");
    if(!d.supported){ toast("Control devices need python-dali 0.11"); return; }
    DEVICES = d.devices||[];
    renderList();
    toast("Found "+DEVICES.length+" control devices");
  }catch(e){ toast("Device scan failed: "+e.message); }
  finally{ b.disabled=false; b.textContent="Scan devices"; }
}

async function detectSwitches(){
  const b=$("#btnDetect");
  // Step 1: safe probe -- count uncommissioned DALI-2 devices, change nothing.
  b.disabled=true; b.innerHTML='<span class="spin"></span> Probing…';
  let found=0;
  try{
    const d = await post("api/commission_devices",{dry_run:true});
    if(d.error) throw new Error(d.error);
    found = d.found||0;
  }catch(e){ toast("Probe failed: "+e.message); b.disabled=false; b.textContent="🎛 Detect switches"; return; }
  finally{ b.disabled=false; b.textContent="🎛 Detect switches"; }

  if(found===0){
    toast("No uncommissioned DALI-2 devices found. If your switches send plain gear commands, use 🔎 Bus monitor + ⚙ Switches instead.");
    return;
  }
  // Step 2: confirm before assigning addresses (this is how Cockpit does it).
  const ok = confirm(
    `Found ${found} DALI-2 control device(s) with no address (your switches / sensors).\n\n`+
    `Assign short addresses to them now, exactly like DALI Cockpit does before it can `+
    `read a switch's configuration?\n\n`+
    `• This only touches the DALI-2 control-device layer — your lamps (control gear) are NOT affected.\n`+
    `• Existing device addresses are preserved.\n`+
    `• After this you can press "Scan devices" to read/configure each switch.`);
  if(!ok) return;

  b.disabled=true; b.innerHTML='<span class="spin"></span> Assigning…';
  try{
    const d = await post("api/commission_devices",{readdress:false});
    if(d.error) throw new Error(d.error);
    toast(`Assigned addresses to ${ (d.programmed||[]).length } device(s). Scanning…`);
    await scanDevices();
  }catch(e){ toast("Commissioning failed: "+e.message); }
  finally{ b.disabled=false; b.textContent="🎛 Detect switches"; }
}

function selectDevice(a){
  SELDEV=a; SEL=null; renderList();
  const d=deviceOf(a); if(!d) return;
  $("#detail").innerHTML=`
    <div class="card">
      <h2>Control device · short address D${a}</h2>
      <div class="muted">Instances: ${d.instances??'?'} · Operating mode: ${d.operating_mode??'–'} · Status: ${d.status??'–'}</div>
      <div class="cmds" style="margin-top:10px">
        <button onclick="identifyDevice(${a})">🔦 Identify device</button>
        <button onclick="loadDevice(${a})">Read instances</button>
      </div>
    </div>
    <div class="card">
      <h2>Instances</h2>
      <div id="devInstances" class="muted">Press “Read instances”.</div>
    </div>
    ${pbCard(a)}
    ${memCard(a,true)}
    <div class="card">
      <h2>Change short address</h2>
      <div class="field"><label>New address (0–63)</label>
        <input type="number" id="newDevAddr" min="0" max="63" value="${a}">
        <button class="warn" onclick="changeDevAddr(${a})">Change</button></div>
      <div class="muted">Button-to-scene mapping (e.g. “press → RECALL MAX to group 8”) is
        stored in the device's Lunatone application config and is not exposed by the
        generic DALI-2 protocol; this panel handles addressing, identify and instances.</div>
    </div>`;
}

async function identifyDevice(a){ try{ await post(`api/device/${a}/identify`); toast("Identifying D"+a); }catch(e){toast(e.message);} }
async function loadDevice(a){
  $("#devInstances").innerHTML='<span class="spin"></span> Reading…';
  try{ const info=await api(`api/device/${a}`);
    const rows=(info.instances||[]).map(i=>`<div class="row" style="cursor:default"><span class="a">Instance ${i.instance}</span><span class="lvl">type ${i.type??'–'}</span></div>`).join("");
    $("#devInstances").innerHTML = rows||'<span class="muted">No instances reported.</span>';
  }catch(e){ $("#devInstances").textContent="Failed: "+e.message; }
}
async function changeDevAddr(a){
  const n=+$("#newDevAddr").value;
  if(n===a) return;
  if(!confirm(`Change control device D${a} → D${n}?`)) return;
  try{ await post(`api/device/${a}/address`,{new:n}); toast("Device address changed. Rescanning…"); SELDEV=n; await scanDevices(); }
  catch(e){toast(e.message);}
}

function select(a){
  SEL=a; SELDEV=null; renderList();
  const g=gearOf(a); if(!g){ return; }
  const groupBoxes = Array.from({length:16},(_,i)=>`
    <label>${i}<input type="checkbox" ${g.groups.includes(i)?'checked':''} onchange="toggleGroup(${a},${i},this.checked)"></label>`).join("");
  const cfgRow=(label,field,val)=>`
    <div class="field"><label>${label}</label>
      <input type="number" id="f_${field}" value="${val??''}" min="0" max="254">
      <button onclick="setField(${a},'${field}')">Set</button></div>`;
  $("#detail").innerHTML=`
    <div class="card">
      <h2>Control gear · short address A${a}</h2>
      <div class="field"><label>Actual level (0–254)</label>
        <input type="range" min="0" max="254" value="${g.level||0}" oninput="lvlOut.value=this.value" onchange="setLevel(${a},this.value)">
        <output id="lvlOut">${g.level||0}</output></div>
      <div class="cmds">
        <button onclick="setLevel(${a},254)">Max</button>
        <button onclick="setLevel(${a},0)">Off</button>
        <button onclick="identify(${a})">🔦 Identify</button>
        <span class="muted">phys.min ${g.physical_min??'–'} · type ${g.device_type??'–'}</span>
      </div>
    </div>

    <div class="card">
      <h2>Device info <span class="muted" style="font-weight:400">— typed memory banks (Cockpit-style)</span></h2>
      <button onclick="loadDeviceInfo(${a})">Read device info</button>
      <div id="devinfo" class="muted" style="margin-top:8px">GTIN, firmware, hardware, energy, diagnostics, luminaire OEM data — decoded from the device's standard memory banks.</div>
    </div>

    <div class="card">
      <h2>Colour <span class="muted" style="font-weight:400">— DT8 (tunable white / RGB)</span></h2>
      <button onclick="loadColour(${a})">Read colour</button>
      <div class="field" style="margin-top:8px"><label>Colour temp (mireds)</label>
        <input type="number" id="ctMireds" min="100" max="1000" value="370" style="width:90px">
        <button onclick="setColourTemp(${a})">Set Tc</button>
        <span class="muted">~2700K=370, 4000K=250, 6500K=153</span></div>
      <div class="field"><label>RGB</label>
        <input type="number" id="cR" min="0" max="254" placeholder="R" style="width:60px">
        <input type="number" id="cG" min="0" max="254" placeholder="G" style="width:60px">
        <input type="number" id="cB" min="0" max="254" placeholder="B" style="width:60px">
        <button onclick="setColourRgb(${a})">Set RGB</button></div>
      <div id="colourbox" class="muted"></div>
    </div>

    <div class="card">
      <h2>Emergency <span class="muted" style="font-weight:400">— DT1</span></h2>
      <div class="cmds">
        <button onclick="loadEmergency(${a})">Read status</button>
        <button onclick="emergencyTest(${a},'function')">Function test</button>
        <button onclick="emergencyTest(${a},'duration')">Duration test</button>
        <button class="warn" onclick="emergencyTest(${a},'stop')">Stop test</button>
      </div>
      <div id="emgbox" class="muted" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>Parameters</h2>
      ${cfgRow('MIN level','min_level',g.min_level)}
      ${cfgRow('MAX level','max_level',g.max_level)}
      ${cfgRow('Power-on level','power_on_level',g.power_on_level)}
      ${cfgRow('System-failure level','system_failure_level',g.system_failure_level)}
      ${cfgRow('Fade time (0–15)','fade_time','')}
      ${cfgRow('Fade rate (1–15)','fade_rate','')}
    </div>

    <div class="card">
      <h2>Groups</h2>
      <div class="grp">${groupBoxes}</div>
    </div>

    <div class="card">
      <h2>Scenes</h2>
      <div id="scenes" class="muted">Loading…</div>
    </div>

    ${memCard(a,false)}

    <div class="card">
      <h2>Change short address</h2>
      <div class="field"><label>New address (0–63)</label>
        <input type="number" id="newAddr" min="0" max="63" value="${a}">
        <button class="warn" onclick="changeAddr(${a})">Change</button></div>
      <div class="muted">Re-addressing changes how this fixture is referenced everywhere.</div>
    </div>`;
  loadScenes(a);
}

async function loadDeviceInfo(a){
  const box=$("#devinfo"); box.innerHTML='<span class="spin"></span> Reading memory banks…';
  try{
    const d=await api(`api/gear/${a}/device_info`);
    if(!(d.groups||[]).length){ box.textContent="No standard memory-bank data (device may implement only bank 0)."; return; }
    box.innerHTML=d.groups.map(g=>`
      <div style="margin:8px 0 4px;font-weight:650">${g.group}</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        ${g.fields.map(f=>`<tr>
          <td style="color:var(--muted);padding:2px 8px 2px 0;white-space:nowrap">${f.name}</td>
          <td style="font-family:monospace">${f.writeable
            ? `<input value="${f.value}" style="width:150px;font-family:monospace" data-fn="${f.name}"><button onclick="saveTyped(${a},'${f.name}',this)">Save</button>`
            : f.value}</td>
          <td class="muted" style="text-align:right">bank ${f.bank}</td></tr>`).join("")}
      </table>`).join("");
  }catch(e){ box.textContent="Failed: "+e.message; }
}
async function saveTyped(a,name,btn){
  const inp=btn.previousElementSibling;
  try{ const r=await post(`api/gear/${a}/device_info/write`,{name,value:inp.value}); toast(name+" = "+r.value); }
  catch(e){ toast("Write failed: "+e.message); }
}
// ---- Colour (DT8) ----
async function loadColour(a){
  const box=$("#colourbox"); box.textContent="Reading…";
  try{ const d=await api(`api/gear/${a}/colour`); box.textContent="status: "+(d.colour_status??'–')+" · features: "+(d.colour_features??'–'); }
  catch(e){ box.textContent="Failed (device may not be DT8): "+e.message; }
}
async function setColourTemp(a){
  try{ await post(`api/gear/${a}/colour/temp`,{mireds:+$("#ctMireds").value}); toast("Colour temp set"); }
  catch(e){ toast(e.message); }
}
async function setColourRgb(a){
  try{ await post(`api/gear/${a}/colour/rgb`,{r:+$("#cR").value||0,g:+$("#cG").value||0,b:+$("#cB").value||0}); toast("RGB set"); }
  catch(e){ toast(e.message); }
}
// ---- Emergency (DT1) ----
async function loadEmergency(a){
  const box=$("#emgbox"); box.textContent="Reading…";
  try{
    const d=await api(`api/gear/${a}/emergency`);
    box.innerHTML=`status: ${d.status??'–'} · mode: ${d.mode??'–'} · battery: ${d.battery_charge??'–'}
      · rated: ${d.rated_duration_min??'–'} min · last duration test: ${d.duration_test_result_min??'–'} min
      · lamp emerg. time: ${d.lamp_emergency_time_h??'–'} h`;
  }catch(e){ box.textContent="Failed (device may not be DT1): "+e.message; }
}
async function emergencyTest(a,kind){
  if(kind==='stop' || confirm("Start "+kind+" test? A duration test fully discharges the battery.")){
    try{ await post(`api/gear/${a}/emergency/test`,{kind}); toast("Emergency "+kind+" "+(kind==='stop'?'stopped':'started')); }
    catch(e){ toast(e.message); }
  }
}
// ---- DALI command console ----
const CONSOLE_CMDS=[["off","Off"],["recall_max","Recall MAX"],["recall_min","Recall MIN"],["up","Up (dim)"],["down","Down (dim)"],["step_up","Step up"],["step_down","Step down"],["on_and_step_up","On & step up"],["goto_last_active","Go to last active"],["dapc","Set level (DAPC 0-254)"],["goto_scene","Go to scene (0-15)"]];
function openCommands(){
  if(monOn) stopMonitor();
  SEL=null; SELDEV=null; renderList();
  $("#detail").innerHTML=`
    <div class="card">
      <h2>DALI command console</h2>
      <div class="muted">Send a raw DALI command to a short address, group, or broadcast (like Cockpit's “DALI Commands”). Use with care — these act on the live bus.</div>
      <div class="field" style="flex-wrap:wrap;margin-top:10px">
        <label style="width:auto">Target</label>
        <select id="cmdKind" onchange="document.getElementById('cmdAddrWrap').style.display=this.value==='broadcast'?'none':''">
          <option value="short">Short address</option>
          <option value="group">Group</option>
          <option value="broadcast">Broadcast</option>
        </select>
        <span id="cmdAddrWrap"><input type="number" id="cmdAddr" min="0" max="63" value="0" style="width:64px"></span>
        <label style="width:auto">Command</label>
        <select id="cmdName" onchange="document.getElementById('cmdArgWrap').style.display=['dapc','goto_scene'].includes(this.value)?'':'none'">
          ${CONSOLE_CMDS.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}
        </select>
        <span id="cmdArgWrap" style="display:none"><input type="number" id="cmdArg" min="0" max="254" value="0" style="width:70px" placeholder="arg"></span>
        <button class="primary" onclick="sendConsoleCmd()">Send</button>
      </div>
      <pre id="cmdLog" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:40vh;overflow:auto;white-space:pre-wrap;font-size:12px;margin:8px 0"></pre>
    </div>`;
}
async function sendConsoleCmd(){
  const kind=$("#cmdKind").value, command=$("#cmdName").value;
  const body={kind, command, address:+($("#cmdAddr")?.value||0)};
  if(['dapc','goto_scene'].includes(command)) body.arg=+$("#cmdArg").value;
  try{
    const r=await post("api/command",body);
    const log=$("#cmdLog"); log.textContent=(new Date().toLocaleTimeString())+"  → "+r.command+(r.response?("  ⇐ "+r.response):"")+"\n"+log.textContent;
  }catch(e){ toast("Failed: "+e.message); }
}
async function setLevel(a,v){ try{ await post(`api/gear/${a}/level`,{level:+v}); (gearOf(a)||{}).level=+v; }catch(e){toast(e.message);} }
async function setField(a,field){
  const v=+$("#f_"+field).value;
  try{ await post(`api/gear/${a}/set`,{field,value:v}); toast(field+" set to "+v);
       const g=gearOf(a); if(g&&field in g) g[field]=v; }catch(e){toast(e.message);}
}
async function identify(a){ try{ await post(`api/gear/${a}/identify`); toast("Blinking A"+a); }catch(e){toast(e.message);} }
async function toggleGroup(a,grp,on){
  try{ await post(`api/gear/${a}/group`,{group:grp,action:on?'add':'remove'});
    const g=gearOf(a); if(g){ g.groups = on?[...new Set([...g.groups,grp])]:g.groups.filter(x=>x!==grp); renderList(); }
  }catch(e){toast(e.message);}
}
async function loadScenes(a){
  try{ const s=await api(`api/gear/${a}/scenes`);
    const cells=Array.from({length:16},(_,i)=>`
      <div class="scene"><div class="n">Scene ${i}</div>
        <input type="number" min="0" max="254" placeholder="—" value="${s[i]??''}"
          onchange="setScene(${a},${i},this.value)"></div>`).join("");
    $("#scenes").innerHTML='<div class="scenes">'+cells+'</div>';
  }catch(e){ $("#scenes").textContent="Failed: "+e.message; }
}
async function setScene(a,scene,v){
  try{
    if(v===''){ await post(`api/gear/${a}/scene`,{scene,clear:true}); toast("Scene "+scene+" cleared"); }
    else { await post(`api/gear/${a}/scene`,{scene,level:+v}); toast("Scene "+scene+" = "+v); }
  }catch(e){toast(e.message);}
}
async function changeAddr(a){
  const n=+$("#newAddr").value;
  if(n===a) return;
  if(!confirm(`Change short address A${a} → A${n}?`)) return;
  try{ const r=await post(`api/gear/${a}/address`,{new:n});
    toast("Address changed"+(r.verified?" (verified)":"")+". Rescanning…"); SEL=n; await scan();
  }catch(e){toast(e.message);}
}
async function commission(){
  if(!confirm("Commission new gear: assign short addresses to currently UNADDRESSED control gear. Existing addresses are kept. Continue?")) return;
  toast("Commissioning… this can take a while");
  try{ await post("api/commission",{readdress:false}); toast("Commissioning done. Rescanning…"); await scan(); }
  catch(e){ toast("Commission failed: "+e.message); }
}
function toggleAdvanced(){
  const b=$("#btnReaddr"); b.style.display = b.style.display==='none' ? '' : 'none';
}
async function readdressAll(){
  // Two gates: an explicit warning, then a typed confirmation phrase.
  const phrase = prompt(
    "⚠ IRREVERSIBLE — RE-ADDRESS ALL\n\n"+
    "This CLEARS the short address of EVERY DALI device on the bus and re-indexes "+
    "them from scratch. All light/group entities, scenes and automations that "+
    "reference DALI addresses WILL break and must be reconfigured. This cannot be undone.\n\n"+
    "If you are absolutely sure, type  READDRESS  (in capitals) to proceed:");
  if(phrase !== "READDRESS"){ toast("Cancelled — nothing changed"); return; }
  toast("Re-addressing the whole bus… this can take minutes");
  try{ await post("api/commission",{readdress:true}); toast("Re-address done. Rescanning…"); await scan(); }
  catch(e){ toast("Re-address failed: "+e.message); }
}
async function reinit(){ try{ await post("api/reinit"); toast("HA entities refreshed"); }catch(e){toast(e.message);} }

// ---- DALI-2 push-button instance config (Part 301) ----
const PB_EVENTS=["button_released","button_pressed","short_press","double_press","long_press_start","long_press_repeat","long_press_stop","button_stuck_free"];
function pbCard(addr){
  return `
    <div class="card">
      <h2>Push-button instance (DALI-2 / Part 301)</h2>
      <div class="field"><label>Instance #</label>
        <input type="number" id="pbInst" value="0" min="0" max="31" style="width:64px">
        <button onclick="readPb(${addr})">Read</button>
        <span id="pbType" class="muted"></span></div>
      <div id="pbBody" class="muted">Read an instance to view/edit its timers and events.</div>
    </div>`;
}
async function readPb(addr){
  const inst=+$("#pbInst").value;
  $("#pbBody").innerHTML='<span class="spin"></span> Reading…';
  try{
    const d=await api(`api/device/${addr}/pb/${inst}`);
    $("#pbType").textContent="type "+(d.instance_type??'–')+(d.instance_type===1?" (push button)":"");
    const t=d.timers||{};
    const timerRow=(k,label,unit)=>`<div class="field"><label>${label}</label>
      <input type="number" id="pbT_${k}" value="${t[k]??''}" min="0" max="255" style="width:80px">
      <span class="muted">${unit}</span><button onclick="setPbTimer(${addr},'${k}')">Set</button></div>`;
    const mask=d.event_filter_mask||0;
    const evBoxes=PB_EVENTS.map((e,i)=>`<label style="display:flex;gap:5px;align-items:center;font-size:12px">
      <input type="checkbox" data-bit="${i}" ${mask&(1<<i)?'checked':''}> ${e}</label>`).join("");
    $("#pbBody").innerHTML=`
      ${timerRow('short','Short timer','×20 ms')}
      ${timerRow('double','Double timer','×20 ms (0=off)')}
      ${timerRow('repeat','Repeat timer','×20 ms')}
      ${timerRow('stuck','Stuck timer','×1 s')}
      <h2 style="font-size:13px;margin:12px 0 6px">Emitted events (filter)</h2>
      <div id="pbEvents" style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;max-width:460px">${evBoxes}</div>
      <div class="cmds" style="margin-top:8px"><button onclick="setPbEvents(${addr})">Set events</button></div>`;
  }catch(e){ $("#pbBody").textContent="Failed: "+e.message; }
}
async function setPbTimer(addr,which){
  const inst=+$("#pbInst").value, value=+$("#pbT_"+which).value;
  try{ await post(`api/device/${addr}/pb/${inst}/timer`,{which,value}); toast(which+" timer set"); }
  catch(e){toast(e.message);}
}
async function setPbEvents(addr){
  const inst=+$("#pbInst").value;
  let mask=0;
  document.querySelectorAll('#pbEvents input[type=checkbox]').forEach(c=>{ if(c.checked) mask|=(1<<+c.dataset.bit); });
  try{ const r=await post(`api/device/${addr}/pb/${inst}/events`,{mask}); toast("Events set (0x"+mask.toString(16)+")"); }
  catch(e){toast(e.message);}
}

// ---- Memory Bank Tool (read/write device memory banks, like Cockpit) ----
function memCard(addr, isDev){
  return `
    <div class="card">
      <h2>Memory banks</h2>
      <div class="field" style="flex-wrap:wrap">
        <label style="width:auto">Bank</label><input type="number" id="memBank" value="0" min="0" max="255" style="width:64px">
        <label style="width:auto">Start</label><input type="number" id="memStart" value="0" min="0" max="255" style="width:64px">
        <label style="width:auto">Count</label><input type="number" id="memCount" value="32" min="1" max="255" style="width:64px">
        <button onclick="readMemory(${addr},${isDev})">Read</button>
      </div>
      <pre id="memOut" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:40vh;overflow:auto;white-space:pre;font-size:12px;margin:6px 0">—</pre>
      <div class="field" style="flex-wrap:wrap">
        <label style="width:auto">Write offset</label><input type="number" id="memWOff" min="0" max="255" style="width:64px">
        <label style="width:auto">value (0–255)</label><input type="number" id="memWVal" min="0" max="255" style="width:70px">
        <label style="width:auto;display:flex;align-items:center;gap:4px"><input type="checkbox" id="memUnlock" checked> unlock</label>
        <button class="warn" onclick="writeMemory(${addr},${isDev})">Write byte</button>
      </div>
      <div class="muted">Reading is safe. <b>Writing changes device configuration</b> — bank 0 is read-only,
        and wrong values can misconfigure a fixture/switch. The write targets only this device
        (addressed ENABLE WRITE MEMORY) and unlocks/relocks the bank.</div>
    </div>`;
}
async function readMemory(addr, isDev){
  const bank=+$("#memBank").value, start=+$("#memStart").value, count=+$("#memCount").value;
  $("#memOut").textContent="Reading…";
  try{
    const d=await api(`api/memory?addr=${addr}&bank=${bank}&start=${start}&count=${count}&device=${isDev?1:0}`);
    $("#memOut").textContent=hexDump(d.data, start);
  }catch(e){ $("#memOut").textContent="Failed: "+e.message; }
}
function hexDump(bytes, start){
  let out="", row=16;
  for(let i=0;i<bytes.length;i+=row){
    const off=(start+i)&0xff;
    const slice=bytes.slice(i,i+row);
    const hex=slice.map(b=>b==null?"--":b.toString(16).padStart(2,"0")).join(" ");
    const asc=slice.map(b=>(b!=null&&b>=32&&b<127)?String.fromCharCode(b):".").join("");
    out+=off.toString(16).padStart(2,"0")+":  "+hex.padEnd(row*3)+"  "+asc+"\n";
  }
  return out||"(no data)";
}
async function writeMemory(addr, isDev){
  const bank=+$("#memBank").value, offset=+$("#memWOff").value, value=+$("#memWVal").value;
  const unlock=$("#memUnlock").checked;
  if(isNaN(offset)||isNaN(value)){ toast("Enter offset and value"); return; }
  if(!confirm(`Write bank ${bank}, offset ${offset} = ${value} (0x${value.toString(16)}) on ${isDev?'D':'A'}${addr}?\n\nThis changes device configuration. Continue?`)) return;
  try{
    const r=await post("api/memory/write",{addr,bank,offset,value,device:isDev,unlock});
    toast("Wrote "+value+" (readback "+r.written+")");
    readMemory(addr,isDev);
  }catch(e){ toast("Write failed: "+e.message); }
}

// ---- Bus monitor (find DALI-1 switches by watching what they transmit) ----
let monOn=false, monLast=0, monTimer=null, monEvents=[], monHidePolls=true;
function toggleMonitor(){ monOn?stopMonitor():startMonitor(); }
// A frame is "bridge polling/noise" if it's a query or carries a response.
function isPoll(e){ return /^Query/i.test(e.cmd||"") || (e.resp && e.resp.length>0); }
function startMonitor(){
  monOn=true; monEvents=[]; $("#btnMon").classList.add("primary"); $("#btnMon").textContent="⏹ Stop monitor";
  SEL=null; SELDEV=null; renderList();
  $("#detail").innerHTML=`
    <div class="card">
      <h2>Bus monitor <span class="muted" style="font-weight:400">— live DALI traffic</span></h2>
      <div class="muted">Press a physical button/switch now. DALI-1 switches have no address and
        can't be scanned — but you can see the command they broadcast here (e.g.
        <code>GoToScene(GroupN, x)</code>, <code>RecallMaxLevel(GroupN)</code>, <code>Off(...)</code>).</div>
      <div class="cmds" style="margin:10px 0;align-items:center">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="monFilter" ${monHidePolls?'checked':''} onchange="monHidePolls=this.checked;renderMonitor()">
          Hide bridge polling (show only button/control commands)</label>
        <button onclick="clearMonitor()">Clear</button>
        <span id="monStat" class="muted">listening…</span></div>
      <pre id="monLog" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:60vh;overflow:auto;white-space:pre-wrap;font-size:12px;margin:0"></pre>
    </div>`;
  pollMonitor();
  monTimer=setInterval(pollMonitor, 1000);
}
function stopMonitor(){
  monOn=false; if(monTimer) clearInterval(monTimer); monTimer=null;
  $("#btnMon").classList.remove("primary"); $("#btnMon").textContent="🔎 Bus monitor";
  const s=$("#monStat"); if(s) s.textContent="stopped";
}
function clearMonitor(){ monEvents=[]; renderMonitor(); }
function renderMonitor(){
  const log=$("#monLog"); if(!log) return;
  let evs = monHidePolls ? monEvents.filter(e=>!isPoll(e)) : monEvents;
  evs = evs.slice(-500);
  log.textContent = evs.map(e=>`${e.t}  ${e.err?'⚠ ':''}${e.cmd}${e.resp?('   -> '+e.resp):''}`).join("\n");
  log.scrollTop=log.scrollHeight;
  const s=$("#monStat"); if(s) s.textContent = evs.length+(monHidePolls?" control frames":" frames")+" ("+monEvents.length+" total)";
}
async function pollMonitor(){
  if(!monOn) return;
  try{
    const d=await api("api/monitor?since="+monLast);
    monLast=d.last||monLast;
    for(const e of (d.events||[])) monEvents.push(e);
    if(monEvents.length>2000) monEvents=monEvents.slice(-2000);
    renderMonitor();
  }catch(e){ const s=$("#monStat"); if(s) s.textContent="error: "+e.message; }
}

// ---- Lunatone config scan (read bank 3 of every gear to find switches) ----
async function scanLunatone(){
  const b=$("#btnScanLuna"); b.disabled=true; b.innerHTML='<span class="spin"></span> Reading…';
  SEL=null; SELDEV=null; renderList();
  $("#detail").innerHTML='<div class="card"><span class="spin"></span> Reading Lunatone config bank (bank 3) from all gear…</div>';
  try{
    const d=await api("api/scan_lunatone?bank=3&count=32");
    const rows=(d.gear||[]).map(g=>{
      const bytes=g.data||[];
      const hex=bytes.map(x=>x==null?"--":x.toString(16).padStart(2,"0")).join(" ");
      const asc=bytes.map(x=>(x!=null&&x>=32&&x<127)?String.fromCharCode(x):".").join("");
      const impl=bytes.some(x=>x!=null);
      return `<div class="row" style="cursor:default;${impl?'':'opacity:.45'}">
          <span class="a">A${g.address}</span>
          <span class="lvl" style="font-family:monospace;font-size:11px">${impl?hex:'(bank 3 not implemented)'}</span>
        </div><div class="muted" style="font-family:monospace;font-size:11px;padding:0 12px 6px 40px">${impl?asc:''}</div>`;
    }).join("");
    $("#detail").innerHTML=`
      <div class="card">
        <h2>Lunatone config — bank ${d.bank} dump</h2>
        <div class="muted">A device whose bank 3 <b>is implemented</b> (non-empty) is likely a Lunatone
          device that stores its configuration here — including, for switches, the target/destination
          address each button sends to. Compare this with the Bus Monitor (which address a press
          targets) to locate the switch and its destination byte(s).</div>
        <div style="margin-top:10px">${rows||'<span class="muted">No gear found.</span>'}</div>
      </div>`;
  }catch(e){ $("#detail").innerHTML='<div class="card">Failed: '+e.message+'</div>'; }
  finally{ b.disabled=false; b.textContent="Scan Lunatone"; }
}

// ---- Switch mapping configurator (physical DALI switch -> HA entity) ----
let ENTITIES = [];
async function openSwitches(){
  if(monOn) stopMonitor();
  SEL=null; SELDEV=null; renderList();
  $("#detail").innerHTML='<div class="card"><span class="spin"></span> Loading switch mapping…</div>';
  try{
    const [sm, ents] = await Promise.all([ api("api/switch_map"), api("api/ha_entities") ]);
    if(sm.ready===false){
      $("#detail").innerHTML='<div class="card">⏳ The bridge is still starting (scanning the DALI bus). Open <b>⚙ Switches</b> again in ~20 seconds — editing now could overwrite your mappings.</div>';
      return;
    }
    ENTITIES = ents.entities||[];
    renderSwitches(sm.switch_map||[]);
  }catch(e){ $("#detail").innerHTML='<div class="card">Failed: '+e.message+'</div>'; }
}
function smRow(a, entities){
  const val = (entities||[]).join(", ");
  return `<div class="field sm-row" style="flex-wrap:wrap;gap:8px;align-items:center">
      <label style="width:auto">Address</label>
      <input type="number" class="sm-addr" min="0" max="63" value="${a??''}" style="width:70px">
      <button onclick="smLearn(this)" title="Press the physical switch, then click">🎯 Learn</button>
      <label style="width:auto">Entities</label>
      <input type="text" class="sm-ents" list="entlist" value="${val}" placeholder="e.g. dining, facade1" style="flex:1;min-width:180px">
      <button class="warn" onclick="this.closest('.sm-row').remove()">✕</button>
    </div>`;
}
function renderSwitches(map){
  const opts = ENTITIES.map(e=>`<option value="${e.name}">${e.id}</option>`).join("");
  $("#detail").innerHTML=`
    <div class="card">
      <h2>Switch mapping <span class="muted" style="font-weight:400">— physical DALI switch → HA entity</span></h2>
      <div class="muted">Each physical switch sends a DALI command to an <b>address</b>. Map that
        address to one or more Home Assistant entities (by name or entity_id). RecallMaxLevel
        turns them on, Off turns them off; brightness-capable lights follow the level.
        Use <b>🎯 Learn</b>: press the physical switch, then click Learn to fill its address.</div>
      <datalist id="entlist">${opts}</datalist>
      <div id="smRows" style="margin:12px 0">${(map.length?map:[]).map(m=>smRow(m.address,m.entities)).join("")}</div>
      <div class="cmds">
        <button onclick="document.getElementById('smRows').insertAdjacentHTML('beforeend', smRow('', []))">+ Add mapping</button>
        <button class="primary" onclick="smSave()">Save</button>
        <span id="smStat" class="muted"></span>
      </div>
      <div class="muted" style="margin-top:8px">${ENTITIES.length} HA entities available for autocomplete.</div>
    </div>`;
}
async function smLearn(btn){
  const row = btn.closest('.sm-row');
  btn.disabled=true; const old=btn.textContent; btn.textContent='…';
  try{
    const d = await api("api/learn");
    const addrs = d.addresses||[];
    if(addrs.length){ row.querySelector('.sm-addr').value = addrs[0]; toast("Learned address "+addrs[0]+(addrs.length>1?" (also seen: "+addrs.slice(1).join(', ')+")":"")); }
    else toast("No switch command seen yet — press the switch first");
  }catch(e){ toast(e.message); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
async function smSave(){
  const rows=[...document.querySelectorAll('#smRows .sm-row')];
  const map=[];
  for(const r of rows){
    const a=r.querySelector('.sm-addr').value;
    const ents=r.querySelector('.sm-ents').value.split(',').map(x=>x.trim()).filter(Boolean);
    if(a!=='' && ents.length) map.push({address:+a, entities:ents});
  }
  $("#smStat").textContent="Saving…";
  try{
    const res=await post("api/switch_map",{switch_map:map});
    $("#smStat").textContent="Saved "+(res.count)+" mappings ✓";
    toast("Switch mapping saved ("+res.count+")");
  }catch(e){ $("#smStat").textContent="Failed: "+e.message; }
}

// auto-scan on load
scan();
</script>
